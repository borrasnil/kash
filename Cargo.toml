[package]
name = "kash"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
rand = "0.8"
sha2 = "0.10"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
